security:
  role_hierarchy:
    ROLE_SUPER_ADMIN: ROLE_ADMIN
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
  providers:
    app_users:
      id: App\Repository\UserRepository
  firewalls:
    dev:
      pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
      security: false
    api:
      pattern: ^/api(?:/|$)
      stateless: true
      provider: app_users
      user_checker: App\Security\UserChecker
      entry_point: App\Security\JsonAuthenticationHandler
      access_denied_handler: App\Security\JsonAuthenticationHandler
      json_login:
        check_path: api_auth_login
        username_path: email
        password_path: password
        success_handler: App\Security\LoginSuccessHandler
        failure_handler: App\Security\JsonAuthenticationHandler
      access_token:
        token_handler: App\Security\AccessTokenHandler
        failure_handler: App\Security\JsonAuthenticationHandler
      login_throttling:
        max_attempts: 5
        interval: '15 minutes'
    main:
      security: false
  access_control:
    - { path: ^/api/healthz$, roles: PUBLIC_ACCESS }
    - {
        path: ^/api/auth/(login|forgot-password|reset-password|invitation(?:/avatar)?|activate)$,
        roles: PUBLIC_ACCESS,
      }
    - { path: ^/api/admin(?:/|$), roles: ROLE_ADMIN }
    - { path: ^/api(?:/|$), roles: ROLE_USER }

when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10
