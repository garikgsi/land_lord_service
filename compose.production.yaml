name: ${COMPOSE_PROJECT_NAME:-landlordservice-prod}

services:
  php:
    image: ${COMPOSE_PROJECT_NAME:-landlordservice-prod}-php:production
    build:
      context: .
      dockerfile: Dockerfile.production
      target: php
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in the production env file}
      DATABASE_URL: postgresql://${POSTGRES_USER:-landlordservice}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-landlordservice}?serverVersion=18&charset=utf8
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:?Set the public HTTPS URL}
      DEFAULT_URI: ${APP_FRONTEND_URL:?Set the public HTTPS URL}
      MAILER_DSN: ${MAILER_DSN:?Set the SMTP DSN}
      MAIL_FROM: ${MAIL_FROM:?Set the sender address}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-28800}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-3600}
      USER_INVITATION_TTL: ${USER_INVITATION_TTL:-86400}
    volumes:
      - ./var/production/avatars:/app/var/avatars
    depends_on:
      database:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  nginx:
    image: ${COMPOSE_PROJECT_NAME:-landlordservice-prod}-nginx:production
    build:
      context: .
      dockerfile: Dockerfile.production
      target: nginx
    restart: unless-stopped
    ports:
      - ${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-18081}:80
    depends_on:
      - php
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/api/healthz]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  database:
    image: postgres:18.7-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-landlordservice}
      POSTGRES_USER: ${POSTGRES_USER:-landlordservice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ./var/production/postgresql:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
