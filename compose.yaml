services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    environment: &application_environment
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_SECRET: ${APP_SECRET:?Generate .env before starting}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-28800}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-3600}
      USER_INVITATION_TTL: ${USER_INVITATION_TTL:-86400}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://127.0.0.1:18080}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      NOTIFICATION_CHANNELS: ${NOTIFICATION_CHANNELS:-db}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-0}
      MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
      DATABASE_URL: postgresql://${POSTGRES_USER:-landlordservice}:${POSTGRES_PASSWORD:?Generate .env before starting}@database:5432/${POSTGRES_DB:-landlordservice}?serverVersion=18&charset=utf8
    volumes:
      - ./backend:/app
      - ./frontend/dist:/app/public/ui:ro
    depends_on:
      database:
        condition: service_healthy

  notifications:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: [sh, bin/notifications-worker]
    restart: unless-stopped
    environment: *application_environment
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.30.7-alpine
    ports:
      - 127.0.0.1:${HTTP_PORT:-18080}:80
    volumes:
      - ./backend/public:/app/public:ro
      - ./frontend/dist:/srv/frontend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/api/healthz]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  database:
    image: postgres:18.7-bookworm
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-15432}:5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-landlordservice}
      POSTGRES_USER: ${POSTGRES_USER:-landlordservice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env before starting}
    volumes:
      - ./var/postgresql:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  node:
    image: node:26.13.1-bookworm-slim
    profiles: [tools]
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      npm_config_cache: /tmp/npm-cache
